<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15803d">
  <title>You're offline - BidhaaLink</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #0f172a; font: 16px/1.55 system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 18px 50px rgba(15, 23, 42, .09); }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 16px 0 8px; font-size: 1.45rem; }
    p { margin: 0 0 22px; color: #64748b; }
    button { min-height: 46px; padding: 10px 18px; border: 0; border-radius: 12px; background: #15803d; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/pwa-192.png" alt="">
    <h1>You're offline</h1>
    <p>Connect to the internet to browse shops, products, and your account.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
