<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Chat</title>

  <!-- Main Global Styles -->
  <link rel="stylesheet" href="/style.css">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Page-Specific Styles -->
  <link rel="stylesheet" href="/css/seller-chat.css">
  <script>if (new URLSearchParams(window.location.search).get('embedded') === '1') document.documentElement.classList.add('embedded');</script>
</head>
<body class="seller-chat-body">

<!-- ===== HEADER ===== -->
<div class="seller-chat-header">
  <h1><i class="fas fa-comment"></i> Live Chat</h1>
  <div class="nav-links">
    <a href="/"><i class="fas fa-home"></i> Home</a>
    <a href="/admin.html"><i class="fas fa-chart-pie"></i> Admin</a>
  </div>
</div>

<!-- ===== CHAT CONTAINER ===== -->
<div id="chatContainer">
  <div class="chat-header">
    <i class="fas fa-comment"></i>
    <span>Seller Support Chat</span>
    <span class="chat-status"><span class="online-dot"></span> Live</span>
  </div>
  <div id="messages"><p class="empty">Loading messages...</p></div>
  <div id="inputArea">
    <input id="msgInput" type="text" placeholder="Type your reply..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/seller-chat.js"></script>

<style>
  /* ============================================================
     Self-contained styles for the legal footer.
     Scoped under .bidhaa-legal-footer so nothing else on any page
     is affected. No external CSS file is required.
     ============================================================ */

  .bidhaa-legal-footer {
    background: #0f172a;
    color: #94a3b8;
    padding: 20px 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.82rem;
    line-height: 1.55;
    margin-top: 32px;
  }

  .bidhaa-legal-footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bidhaa-legal-footer-brand strong {
    color: #ffffff;
    font-weight: 800;
    font-size: 0.9rem;
  }

  .bidhaa-legal-footer-brand span {
    color: #64748b;
    font-size: 0.72rem;
  }

  .bidhaa-legal-footer-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.8rem;
    transition: color 0.15s ease;
  }

  .bidhaa-legal-footer-links a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  .bidhaa-legal-footer-links i {
    color: #2563eb;
    font-size: 0.75rem;
  }

  /* On small screens, stack the brand above the links. */
  @media (max-width: 640px) {
    .bidhaa-legal-footer-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .bidhaa-legal-footer-links {
      gap: 12px;
    }

    .bidhaa-legal-footer-links a {
      font-size: 0.75rem;
    }
  }

  /* If the page already has a fixed bottom nav (e.g. the
     marketplace home, the cart, the account page), make sure the
     footer clears it so it is never hidden behind the nav. */
  body.index-body .bidhaa-legal-footer,
  body:has(.bottom-nav) .bidhaa-legal-footer {
    margin-bottom: 90px;
  }
</style>

<!-- Load the legal script only if the page did not already load it.
     The script is idempotent: it will not double-bind if it is
     loaded more than once, and it will not show the cookie banner
     twice. -->
<script>
  (function () {
    if (window.__bidhaa_legal_script_loaded) return;
    window.__bidhaa_legal_script_loaded = true;

    var existing = Array.prototype.some.call(
      document.getElementsByTagName('script'),
      function (s) { return s.src && s.src.indexOf('/js/legal.js') !== -1; }
    );

    if (existing) return;

    var tag = document.createElement('script');
    tag.src = '/js/legal.js';
    tag.defer = true;
    document.body.appendChild(tag);
  })();
</script> 
</body>
