<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Admin – Orders</title>

  <!-- Main Global Styles -->
  <link rel="stylesheet" href="/style.css">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Page-Specific Styles -->
  <link rel="stylesheet" href="/css/admin-orders.css?v=mobile-superadmin-20261009-v2">

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

</head>
<body>

<!-- ===== HEADER ===== -->
<div class="admin-header">
  <h1 style="font-size:1.2rem;">🔐 Admin Panel</h1>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <a href="/admin.html" aria-label="Dashboard" title="Dashboard"><i class="fas fa-chart-pie" aria-hidden="true"></i><span>Dashboard</span></a>
    <a href="/admin-orders.html" aria-label="Orders" title="Orders"><i class="fas fa-box" aria-hidden="true"></i><span>Orders</span></a>
    <a href="/" aria-label="Marketplace" title="Marketplace"><i class="fas fa-store" aria-hidden="true"></i><span>Marketplace</span></a>
    <a href="#" aria-label="Logout" title="Logout" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt" aria-hidden="true"></i><span>Logout</span></a>
  </div>
</div>

<!-- ===== ORDERS PAGE ===== -->
<div class="orders-page">
  <a href="/admin.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <h1>📦 Orders</h1>
    <button class="btn btn-primary" onclick="loadOrders()"><i class="fas fa-sync"></i> Refresh</button>
  </div>

  <div class="filter-bar">
    <label>Status:</label>
    <select id="filterStatus">
      <option value="all">All</option>
      <option value="pending">Pending</option>
      <option value="pending_payment">Awaiting Payment</option>
      <option value="confirmed">Confirmed</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="received">Received</option>
      <option value="cancelled">Cancelled</option>
      <option value="replacements">Replacements</option>
      <option value="refunds">Refunds</option>
      <option value="urgent">Urgent</option>
      <option value="returns">Returns</option>
    </select>
    <label>Search:</label>
    <input type="text" id="filterSearch" placeholder="Name, email, ref...">
    <label>From:</label>
    <input type="date" id="filterStart">
    <label>To:</label>
    <input type="date" id="filterEnd">
    <button onclick="applyFilters()">Apply</button>
    <button onclick="resetFilters()" style="background:#64748b;">Reset</button>
  </div>

  <div class="bulk-actions" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0;">
    <label><input type="checkbox" id="selectAllOrders" onchange="toggleAllOrders(this.checked)"> Select all visible</label>
    <select id="bulkStatus">
      <option value="">Bulk status...</option>
      <option value="confirmed">Confirmed</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="received">Received</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="applyBulkStatus()"><i class="fas fa-layer-group"></i> Apply</button>
    <button class="btn btn-danger btn-sm" onclick="deleteSelectedOrders()"><i class="fas fa-trash"></i> Delete Closed</button>
    <a class="btn btn-secondary btn-sm" href="/api/admin/orders/export"><i class="fas fa-file-csv"></i> Export CSV</a>
  </div>

  <div id="ordersContainer">
    <p style="text-align:center; padding:20px; color:#94a3b8;">Loading orders...</p>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/js/cookie-auth-client.js"></script>
<script src="/js/admin-orders.js"></script>

<style>
  /* ============================================================
     Self-contained styles for the legal footer.
     Scoped under .bidhaa-legal-footer so nothing else on any page
     is affected. No external CSS file is required.
     ============================================================ */

  .bidhaa-legal-footer {
    background: #0f172a;
    color: #94a3b8;
    padding: 20px 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.82rem;
    line-height: 1.55;
    margin-top: 32px;
  }

  .bidhaa-legal-footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bidhaa-legal-footer-brand strong {
    color: #ffffff;
    font-weight: 800;
    font-size: 0.9rem;
  }

  .bidhaa-legal-footer-brand span {
    color: #64748b;
    font-size: 0.72rem;
  }

  .bidhaa-legal-footer-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.8rem;
    transition: color 0.15s ease;
  }

  .bidhaa-legal-footer-links a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  .bidhaa-legal-footer-links i {
    color: #2563eb;
    font-size: 0.75rem;
  }

  /* On small screens, stack the brand above the links. */
  @media (max-width: 640px) {
    .bidhaa-legal-footer-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .bidhaa-legal-footer-links {
      gap: 12px;
    }

    .bidhaa-legal-footer-links a {
      font-size: 0.75rem;
    }
  }

  /* If the page already has a fixed bottom nav (e.g. the
     marketplace home, the cart, the account page), make sure the
     footer clears it so it is never hidden behind the nav. */
  body.index-body .bidhaa-legal-footer,
  body:has(.bottom-nav) .bidhaa-legal-footer {
    margin-bottom: 90px;
  }
</style>

<!-- Load the legal script only if the page did not already load it.
     The script is idempotent: it will not double-bind if it is
     loaded more than once, and it will not show the cookie banner
     twice. -->
<script>
  (function () {
    if (window.__bidhaa_legal_script_loaded) return;
    window.__bidhaa_legal_script_loaded = true;

    var existing = Array.prototype.some.call(
      document.getElementsByTagName('script'),
      function (s) { return s.src && s.src.indexOf('/js/legal.js') !== -1; }
    );

    if (existing) return;

    var tag = document.createElement('script');
    tag.src = '/js/legal.js';
    tag.defer = true;
    document.body.appendChild(tag);
  })();
</script>
<script src="/js/assistant.js" defer></script>
