<style>
  /* ============================================================
     Self-contained styles for the legal footer.
     Scoped under .bidhaa-legal-footer so nothing else on any page
     is affected. No external CSS file is required.
     ============================================================ */

  .bidhaa-legal-footer {
    background: #0f172a;
    color: #94a3b8;
    padding: 20px 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.82rem;
    line-height: 1.55;
    margin-top: 32px;
  }

  .bidhaa-legal-footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bidhaa-legal-footer-brand strong {
    color: #ffffff;
    font-weight: 800;
    font-size: 0.9rem;
  }

  .bidhaa-legal-footer-brand span {
    color: #64748b;
    font-size: 0.72rem;
  }

  .bidhaa-legal-footer-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.8rem;
    transition: color 0.15s ease;
  }

  .bidhaa-legal-footer-links a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  .bidhaa-legal-footer-links i {
    color: #2563eb;
    font-size: 0.75rem;
  }

  /* On small screens, stack the brand above the links. */
  @media (max-width: 640px) {
    .bidhaa-legal-footer-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .bidhaa-legal-footer-links {
      gap: 12px;
    }

    .bidhaa-legal-footer-links a {
      font-size: 0.75rem;
    }
  }

  /* If the page already has a fixed bottom nav (e.g. the
     marketplace home, the cart, the account page), make sure the
     footer clears it so it is never hidden behind the nav. */
  body.index-body .bidhaa-legal-footer,
  body:has(.bottom-nav) .bidhaa-legal-footer {
    margin-bottom: 90px;
  }
</style>

<!-- Load the legal script only if the page did not already load it.
     The script is idempotent: it will not double-bind if it is
     loaded more than once, and it will not show the cookie banner
     twice. -->
<script>
  (function () {
    if (window.__bidhaa_legal_script_loaded) return;
    window.__bidhaa_legal_script_loaded = true;

    var existing = Array.prototype.some.call(
      document.getElementsByTagName('script'),
      function (s) { return s.src && s.src.indexOf('/js/legal.js') !== -1; }
    );

    if (existing) return;

    var tag = document.createElement('script');
    tag.src = '/js/legal.js';
    tag.defer = true;
    document.body.appendChild(tag);
  })();
</script> 
  <script src="/js/cookie-auth-client.js"></script>

<body>

<!-- ===== HEADER ===== -->
<div class="reset-header">
  <h1><i class="fas fa-store"></i> <span id="shopNameHeader">Our Business</span></h1>
  <a href="/"><i class="fas fa-home"></i> Home</a>
</div>

<!-- ===== RESET PAGE ===== -->
<div class="reset-page">
  <div class="reset-card">
    <h1>🔑 Reset Password</h1>
    <p class="sub" id="pageSub">Enter your email to receive a reset link.</p>

    <div id="step1">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="your@email.com">
      </div>
      <button class="btn" onclick="requestReset()">Send Reset Link</button>
    </div>

    <div id="step2" style="display:none;">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password">
      </div>
      <button class="btn btn-success" onclick="resetPassword()">Reset Password</button>
    </div>

    <div id="status" class="status"></div>
    <a href="/marketplace" class="back-link" data-context-back><i class="fas fa-arrow-left"></i> Back to Shop</a>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/js/reset-password.js"></script>
<script src="/js/back-navigation.js"></script>
<script src="/js/assistant.js" defer></script>
</body>
