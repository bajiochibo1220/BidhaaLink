<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Product Detail</title>

  <!-- Main Global Styles -->
  <link rel="stylesheet" href="/style.css?v=bidhaalink-header-20261007-v1">
  <link rel="stylesheet" href="/css/assistant.css">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Page-Specific Styles -->
  <link rel="stylesheet" href="/css/product-detail.css?v=product-inquiry-20261006">
  <link rel="stylesheet" href="/css/product-inquiry.css?v=card-contact-menu-20261006-v2">
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="product-detail-brand-group">
    <a class="bidhaalink-brand" href="/marketplace" aria-label="BidhaaLink home">
      <img src="/icons/bidhaalink-app.svg" alt="" width="30" height="30">
      <span>BidhaaLink</span>
    </a>
    <span class="product-detail-shop-name" id="shopNameHeader">Our Business</span>
  </div>
  <div class="header-right">
    <a href="#" id="productBusinessHome">Home</a>
    <a href="/marketplace" class="auth-btn" id="backToMarketplaceTop" data-context-back><i class="fas fa-arrow-left"></i> Back to Marketplace</a>
    <a href="/cart.html" id="productHeaderCart" style="position:relative;">
      <i class="fas fa-shopping-cart" style="font-size:1.2rem;"></i>
      <span id="cartBadge" style="position:absolute; top:-6px; right:-8px; background:#ef4444; color:white; border-radius:50%; padding:0 5px; font-size:0.55rem; min-width:16px; text-align:center; font-weight:700; display:none;">0</span>
    </a>
  </div>
</div>

<!-- ===== PRODUCT DETAIL ===== -->
<div class="product-detail-page" id="productDetail">
  <a href="/marketplace" class="back-link" data-context-back><i class="fas fa-arrow-left"></i> Back to Shop</a>
  <div id="detailContent"><p style="text-align:center; padding:40px;">Loading...</p></div>
</div>

<!-- ============================================================ -->
<!-- THANK-YOU BAND                                               -->
<!--                                                              -->
<!-- Replaces the old reviews section. Warm, positive, and always -->
<!-- visible. The business name is injected by product-detail.js   -->
<!-- into #thankYouBusinessName so the band feels personal.        -->
<!-- No review UI, no stars, no textarea.                          -->
<!-- ============================================================ -->
<div class="thank-you-band" id="thankYouBand" role="contentinfo">
  <div class="thank-you-band-inner">
    <span class="thank-you-band-icon" aria-hidden="true">🙏</span>
    <p class="thank-you-band-text">
      Thank you for visiting <span id="thankYouBusinessName">our business</span>. We value you!
    </p>
  </div>
</div>

<div class="related-image-preview-modal" id="relatedImagePreviewModal" role="dialog" aria-modal="true" aria-label="Product image preview" onclick="if (event.target === this) closeRelatedImagePreview()">
  <button type="button" class="related-image-preview-close" aria-label="Close image preview" onclick="closeRelatedImagePreview()">&times;</button>
  <img id="relatedImagePreviewImage" alt="Product image preview">
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bottom-nav">
  <a href="#" id="productBusinessHomeNav"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/category.html" id="productNavCategory"><i class="fas fa-th-large"></i><span>Category</span></a>
  <a href="#" id="productNavMessages" onclick="openChatTab(); return false;"><i class="fas fa-envelope"></i><span>Messages</span></a>
  <a href="/cart.html" id="productNavCart" style="position:relative;">
    <i class="fas fa-shopping-cart"></i>
    <span class="nav-badge" id="navCartBadge">0</span>
    <span>Cart</span>
  </a>
  <a href="/account.html" id="productNavAccount"><i class="fas fa-user"></i><span>Account</span></a>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/js/cart-store.js?v=unified-cart-20261006-v1"></script>
<script src="/js/cookie-auth-client.js"></script>
<script src="/js/product-inquiry.js?v=card-contact-menu-20261006-v6"></script>
<script src="/js/product-detail.js?v=contact-options-20261006-v3"></script>
<script src="/js/back-navigation.js"></script>
<script src="/js/assistant.js" defer></script>

<!-- Terms · Privacy · Cookie Notice · Contact                     -->

<!-- appears on this page, unless the page already loads it.        -->
<!-- ============================================================ -->

<footer class="bidhaa-legal-footer" role="contentinfo">
  <div class="bidhaa-legal-footer-inner">
    <div class="bidhaa-legal-footer-brand">
      <strong>BidhaaLink</strong>
      <span>Kenya's Multi-Vendor Marketplace</span>
    </div>
    <nav class="bidhaa-legal-footer-links" aria-label="Legal and contact links">
      <a href="/terms.html">
        <i class="fas fa-file-contract" aria-hidden="true"></i> Terms and Conditions
      </a>
      <a href="/privacy.html">
        <i class="fas fa-shield-halved" aria-hidden="true"></i> Privacy Policy
      </a>
      <a href="/privacy.html#cookies">
        <i class="fas fa-cookie-bite" aria-hidden="true"></i> Cookie Notice
      </a>
      <a href="mailto:georgebabji1220@gmail.com">
        <i class="fas fa-envelope" aria-hidden="true"></i> Contact
      </a>
    </nav>
  </div>
</footer>

<style>
  /* ============================================================
     Self-contained styles for the legal footer.
     Scoped under .bidhaa-legal-footer so nothing else on any page
     is affected. No external CSS file is required.
     ============================================================ */

  .bidhaa-legal-footer {
    background: #0f172a;
    color: #94a3b8;
    padding: 20px 20px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.82rem;
    line-height: 1.55;
    margin-top: 32px;
  }

  .bidhaa-legal-footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bidhaa-legal-footer-brand strong {
    color: #ffffff;
    font-weight: 800;
    font-size: 0.9rem;
  }

  .bidhaa-legal-footer-brand span {
    color: #64748b;
    font-size: 0.72rem;
  }

  .bidhaa-legal-footer-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .bidhaa-legal-footer-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.8rem;
    transition: color 0.15s ease;
  }

  .bidhaa-legal-footer-links a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  .bidhaa-legal-footer-links i {
    color: #2563eb;
    font-size: 0.75rem;
  }

  /* On small screens, stack the brand above the links. */
  @media (max-width: 640px) {
    .bidhaa-legal-footer-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .bidhaa-legal-footer-links {
      gap: 12px;
    }

    .bidhaa-legal-footer-links a {
      font-size: 0.75rem;
    }
  }

  /* If the page already has a fixed bottom nav (e.g. the
     marketplace home, the cart, the account page), make sure the
     footer clears it so it is never hidden behind the nav. */
  body.index-body .bidhaa-legal-footer,
  body:has(.bottom-nav) .bidhaa-legal-footer {
    margin-bottom: 90px;
  }
</style>

<!-- Load the legal script only if the page did not already load it.
     The script is idempotent: it will not double-bind if it is
     loaded more than once, and it will not show the cookie banner
     twice. -->
<script>
  (function () {
    if (window.__bidhaa_legal_script_loaded) return;
    window.__bidhaa_legal_script_loaded = true;

    var existing = Array.prototype.some.call(
      document.getElementsByTagName('script'),
      function (s) { return s.src && s.src.indexOf('/js/legal.js') !== -1; }
    );

    if (existing) return;

    var tag = document.createElement('script');
    tag.src = '/js/legal.js';
    tag.defer = true;
    document.body.appendChild(tag);
  })();
</script>
</body>
</html>
