<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - BidhaaLink</title>
  <meta name="description" content="BidhaaLink Super Admin Panel — platform administrators only.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid #eef2f6;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #16a34a;
      letter-spacing: 0.03em;
    }

    .brand span {
      color: #0f172a;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .login-box .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .login-box h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
    }

    .login-box .sub {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      margin: 4px 0 18px;
    }

    .auth-tabs button {
      flex: 1;
      padding: 10px 6px;
      border: none;
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      color: #64748b;
      border-bottom: 3px solid transparent;
      transition: all 0.15s ease;
    }

    .auth-tabs button.active {
      background: #ffffff;
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    .auth-tabs button:hover:not(.active) {
      background: #f1f5f9;
      color: #334155;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      color: #334155;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .pwd-wrapper {
      position: relative;
    }

    .pwd-wrapper .toggle-pwd {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.95rem;
    }

    .pwd-wrapper .toggle-pwd:hover {
      color: #475569;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .status.error    { display: block; background: #fef2f2; color: #991b1b; }
    .status.success  { display: block; background: #f0fdf4; color: #166534; }
    .status.loading  { display: block; background: #eff6ff; color: #1e40af; }

    .business-links {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .business-links a {
      font-size: 0.8rem;
      color: #64748b;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    .business-links a:hover {
      border-color: #16a34a;
      color: #16a34a;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 0.7rem;
      color: #94a3b8;
      text-align: center;
    }

    .footer-note strong {
      color: #16a34a;
      font-weight: 800;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-box" id="loginBox">

    <div class="brand">
      🛍️ BidhaaLink <span>Super Admin</span>
    </div>

    <div class="icon">🔐</div>
    <h1 id="pageTitle">Super Admin</h1>
    <p class="sub" id="pageSub">Checking setup…</p>

    <!-- Tabs -->
    <div class="auth-tabs" id="authTabs" style="display:none;">
      <button type="button" id="tabLogin" class="active" onclick="showTab('login')">Login</button>
      <button type="button" id="tabRegister" onclick="showTab('register')">Register</button>
    </div>

    <!-- Login form -->
    <div id="loginForm" style="display:none;">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="off">
      </div>
      <div class="form-group pwd-wrapper">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="off">
        <button type="button" class="toggle-pwd" onclick="togglePassword('loginPassword', this)" aria-label="Show or hide password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <button class="btn" id="loginBtn" onclick="handleLogin()">Login</button>
      <div id="loginStatus" class="status"></div>
    </div>

    <!-- Register form -->
    <div id="registerForm" style="display:none;">
      <p class="sub" style="text-align:left; margin-bottom:14px;">
        No super admin exists yet. Create the first one below.
        This tab disappears the moment an account exists.
      </p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="form-group pwd-wrapper">
        <label>Password <span style="font-weight:400; color:#94a3b8; font-size:0.7rem;">(min 6 characters)</span></label>
        <input type="password" id="regPassword" placeholder="Choose a strong password" autocomplete="new-password">
        <button type="button" class="toggle-pwd" onclick="togglePassword('regPassword', this)" aria-label="Show or hide password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <div class="form-group pwd-wrapper">
        <label>Confirm Password</label>
        <input type="password" id="regConfirm" placeholder="Re-enter password" autocomplete="new-password">
        <button type="button" class="toggle-pwd" onclick="togglePassword('regConfirm', this)" aria-label="Show or hide password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <button class="btn" id="registerBtn" onclick="handleRegister()">Create Super Admin</button>
      <div id="registerStatus" class="status"></div>
    </div>

    <div class="business-links">
      <a href="/business-login.html">🏪 Business Login</a>
      <a href="/register-business.html">📝 Register Business</a>
      <a href="/marketplace">🏠 Back to Marketplace</a>
    </div>

    <div class="footer-note">
      Powered by <strong>BidhaaLink</strong> — Kenya's Multi-Vendor Marketplace
    </div>

  </div>

  <script src="/js/cookie-auth-client.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
